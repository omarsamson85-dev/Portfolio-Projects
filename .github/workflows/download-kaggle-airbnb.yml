name: Validate Public Airbnb Dataset

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/download-kaggle-airbnb.yml'

permissions:
  contents: read

jobs:
  validate-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install KaggleHub
        run: python -m pip install --upgrade pip kagglehub

      - name: Download public Airbnb dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          import kagglehub

          source = Path(kagglehub.dataset_download('alexanderfreberg/airbnb-listings-2016-dataset'))
          print(f'Dataset path: {source}')
          print('Downloaded files:')
          for item in source.rglob('*'):
              if item.is_file():
                  print(item.relative_to(source))
          PY

      - name: Complete validation
        run: echo "Public Kaggle dataset download completed successfully."
