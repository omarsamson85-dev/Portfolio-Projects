name: Build Dashboard Data

on:
  workflow_dispatch:

jobs:
  build-dashboard-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle pandas

      - name: Download Kaggle dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p data
          kaggle datasets download samsonomar/project-source-data \
            --path data \
            --unzip

          echo "Downloaded files:"
          find data -maxdepth 2 -type f -printf '%p\n'

      - name: Validate source data
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          required = {
              "listings.csv": 92,
              "calendar.csv": 4,
              "reviews.csv": 6,
          }

          for name, expected_columns in required.items():
              file = Path("data") / name
              if not file.exists():
                  raise FileNotFoundError(f"Missing required dataset file: {file}")

              df = pd.read_csv(file)
              print(f"{name}: {len(df):,} rows, {len(df.columns)} columns")

              if len(df.columns) != expected_columns:
                  raise ValueError(
                      f"Unexpected column count for {name}: "
                      f"expected {expected_columns}, got {len(df.columns)}"
                  )

          print("Kaggle dataset validation passed.")
          PY

      - name: Complete job
        run: echo "Kaggle data connection and validation completed successfully."
