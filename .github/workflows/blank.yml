name: Build Dashboard Data

on:
  workflow_dispatch:

jobs:
  build-dashboard-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle pandas

      - name: Download Kaggle dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p data
          kaggle datasets download samsonomar/project-source-data \
            --path data \
            --unzip

          echo "Downloaded files:"
          find data -maxdepth 2 -type f -printf '%p\n'

      - name: Inspect dataset
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          for file in Path("data").glob("*.csv"):
              print("\n" + "=" * 80)
              print(f"FILE: {file}")
              print("=" * 80)
              df = pd.read_csv(file)
              print(f"Rows: {len(df):,}")
              print(f"Columns: {len(df.columns)}")
              print("\nMissing values:")
              print(df.isna().sum().to_string())
          PY

      - name: Prepare dashboard data
        run: |
          mkdir -p dashboard_data
          python - <<'PY'
          import pandas as pd

          listings = pd.read_csv("data/listings.csv")
          calendar = pd.read_csv("data/calendar.csv")
          reviews = pd.read_csv("data/reviews.csv")

          listing_columns = [
              "id", "name", "neighbourhood_cleansed", "room_type", "property_type",
              "accommodates", "bathrooms", "bedrooms", "beds", "price",
              "number_of_reviews", "review_scores_rating", "review_scores_accuracy",
              "review_scores_cleanliness", "review_scores_checkin",
              "review_scores_communication", "review_scores_location",
              "review_scores_value"
          ]
          listings[listing_columns].to_csv("dashboard_data/listings_dashboard.csv", index=False)

          calendar[["listing_id", "date", "available", "price"]].to_csv(
              "dashboard_data/calendar_dashboard.csv", index=False
          )

          reviews[["listing_id", "id", "date", "reviewer_id", "reviewer_name"]].to_csv(
              "dashboard_data/reviews_dashboard.csv", index=False
          )

          print("Dashboard data prepared successfully.")
          PY

      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_data/
          if git diff --cached --quiet; then
            echo "No dashboard data changes to commit."
          else
            git commit -m "Update dashboard data"
            git push
          fi

      - name: Complete job
        run: echo "Dashboard data build completed successfully."
