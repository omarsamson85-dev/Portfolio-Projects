name: Test Kaggle Connection

on:
  workflow_dispatch:

jobs:
  test-kaggle:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install kaggle

      - name: Download Kaggle dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p data
          kaggle datasets download samsonomar/project-source-data \
            --path data \
            --unzip

          echo "Downloaded files:"
          find data -maxdepth 2 -type f -printf '%p\n'
