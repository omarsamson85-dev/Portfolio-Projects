name: Test Kaggle Connection

on:
  workflow_dispatch:

jobs:
  test-kaggle:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install kaggle

      - name: Test Kaggle dataset access
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          echo "Testing access to private Kaggle dataset..."
          kaggle datasets files samsonomar/project-source-data
