- name: Test Kaggle authentication
  env:
    KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  run: |
    if [ -z "$KAGGLE_API_TOKEN" ]; then
      echo "ERROR: KAGGLE_API_TOKEN was not supplied by GitHub."
      exit 1
    fi

    echo "KAGGLE_API_TOKEN is present."
    kaggle datasets list -s project-source-data
